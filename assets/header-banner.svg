<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Justine Lloyd Bautista</title>
  <desc id="desc">Justine Lloyd Bautista — Software Developer and UI/UX &amp; Visual Designer based in the Philippines.</desc>

  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101827" stop-opacity="1" />
      <stop offset="0.55" stop-color="#101827" stop-opacity="0.92" />
      <stop offset="1" stop-color="#101827" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28" />
      <stop offset="1" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="400" rx="24" fill="#101827" />

  <!-- atmosphere: diagonal plane + blueprint geometry, kept behind the type -->
  <path d="M760 0H1200V400H620Z" fill="#16233B" />
  <rect width="1200" height="400" rx="24" fill="url(#glow)" />

  <g opacity="0.5">
    <circle cx="975" cy="200" r="136" fill="none" stroke="#2563EB" stroke-width="7" />
    <circle cx="975" cy="200" r="94" fill="none" stroke="#334B70" stroke-width="5" />
    <path d="M825 200H1125M975 55V345" stroke="#334B70" stroke-width="4" />
    <circle cx="975" cy="200" r="9" fill="#60A5FA" />
  </g>

  <!-- scrim so the type never fights the geometry -->
  <rect width="1200" height="400" rx="24" fill="url(#scrim)" />

  <!-- accent bar -->
  <rect x="88" y="100" width="92" height="10" rx="5" fill="#60A5FA" />

  <g font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="88" y="208" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">Justine Lloyd Bautista</text>
    <text x="90" y="268" font-size="34" font-weight="500" fill="#BFDBFE">Software Developer · UI/UX &amp; Visual Designer</text>
  </g>

  <text x="90" y="330" font-size="25" font-weight="600" letter-spacing="7"
        font-family="ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace"
        fill="#93C5FD">PHILIPPINES</text>
</svg>
